name = "pixiv-imgproxy"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名：workers.dev 在国内和机场被大面积拉黑，必须绑自己的域名。
# custom_domain = true 时 Cloudflare 会自动创建 DNS 记录和 SSL 证书。
routes = [
  { pattern = "pixiv.xuetom.top", custom_domain = true }
]

# 图片翻译缓存：同一个 (图片URL + 引擎 + 目标语言 + 样式版本) 只处理一次
# 创建方式： npx wrangler kv namespace create TRANSLATE_CACHE
# 把输出里的 id 填到下面
[[kv_namespaces]]
binding = "TRANSLATE_CACHE"
id = "9e9c5d9716194706a5219820ec4a2009"

[vars]
# ── 运行模式 ────────────────────────────────────────────────
# 1 = 只透传原图（验证阶段：确认 Pixiv 接不接受代理返回的图）
# 0 = 完整翻译链路
PASSTHROUGH_ONLY = "0"

# 打开后 Worker 日志会打印每次透传的图片信息，排查用
LOG_PASSTHROUGH = "0"

# ── 视觉引擎 ────────────────────────────────────────────────
# gemini / openai / custom（custom 适合 DeepSeek-VL、Qwen-VL 等 OpenAI 兼容端点）
VISION_ENGINE = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"

# ── 目标语言 ────────────────────────────────────────────────
DEFAULT_TARGET_LANG = "zh-CN"

# ── 字体 ────────────────────────────────────────────────────
# 已实测可用：Noto Sans SC 的 woff2，1.09MB，resvg 能直接解析，中文渲染正常。
# 想换字体就把 URL 改掉，或改用 base64 塞进 secret FONT。
FONT_URL = "https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/files/noto-sans-sc-chinese-simplified-400-normal.woff2"

# ── 渲染样式 ────────────────────────────────────────────────
# 样式版本：改动渲染逻辑时递增，自动让旧缓存失效
STYLE_VERSION = "v1"

# 浅色页默认：纸色遮罩 + 黑字 + 白描边
THEME_FILL = "#fffdf8"
THEME_TEXT = "#111111"
THEME_STROKE = "#ffffff"
# 遮罩不透明度：日文笔画密，低于 0.95 原文会透出来
THEME_OPACITY = "1"
# 遮罩相对气泡框的外扩比例。只给极小值补模型误差，
# 给大了会把气泡原生的黑色轮廓线一起吃掉。
THEME_PAD_GROW = "0.015"
